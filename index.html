<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Feed — Central de Notícias</title>
  
  <!-- FAVICON E ÍCONE PARA NAVEGADORES E IOS -->
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="apple-touch-icon" href="./logo.png">
  
  <!-- ESTILOS E FONTES -->
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ONBOARDING (PRIMEIRO ACESSO) -->
  <div id="onboarding-screen" class="overlay-screen">
    <div class="modal-content onboarding-modal">
      <header class="modal-header-simple">
        <h2>Bem-vindo ao Meu Feed 📰</h2>
        <p>Escolha as editorias e termos prioritários para o seu dia a dia.</p>
      </header>

      <div class="custom-keywords-box">
        <label for="onboarding-keywords"><strong>Tópicos e Times Favoritos:</strong></label>
        <input type="text" id="onboarding-keywords" value="Internacional, Inter, Colorado, UFC, economia, política">
      </div>

      <div class="category-selection-container">
        <label><strong>Selecione as Editorias do seu Feed:</strong></label>
        <div class="category-selection-grid" id="onboarding-categories"></div>
      </div>

      <button id="btn-finish-onboarding" class="primary-btn">Salvar e Acessar o Feed</button>
    </div>
  </div>

  <!-- CABEÇALHO PRINCIPAL DO APP -->
  <header class="app-header">
    <div class="header-container">
      
      <!-- LOGO E TÍTULO LIMPOS -->
      <div class="brand-zone" id="brand-home-btn" style="cursor: pointer; display: flex; align-items: center; gap: 10px;" title="Voltar ao início">
        <img src="./logo.png" alt="Logo Meu Feed" style="height: 36px; width: auto; object-fit: contain;">
        <h1 style="margin: 0; line-height: 1;">Meu <span>Feed</span></h1>
      </div>

      <!-- AÇÕES DO CABEÇALHO -->
      <div class="header-actions">
        <button id="btn-toggle-oled" class="icon-btn" title="Alternar Modo OLED Black">📱 OLED</button>
        <div class="search-zone">
          <input type="text" id="search-input" placeholder="Filtrar matérias por texto..." aria-label="Buscar notícias">
          <button id="btn-refresh" class="icon-btn" title="Atualizar notícias">🔄</button>
        </div>
      </div>

    </div>
  </header>

  <!-- BARRA DE FILTROS POR CATEGORIAS (No PC fica no topo; no mobile fica oculta pois vai para o menu) -->
  <nav id="category-filter-bar" class="category-filter-bar" aria-label="Filtro de Categorias"></nav>

  <!-- CARROSSEL DE NOTÍCIAS -->
  <section class="carousel-section">
    <div class="carousel-header">
      <span class="breaking-badge">🔥 ÚLTIMAS ATUALIZAÇÕES</span>
      <div class="carousel-controls">
        <button id="btn-carousel-prev" class="carousel-btn">‹</button>
        <button id="btn-carousel-next" class="carousel-btn">›</button>
      </div>
    </div>
    <div id="carousel-track" class="carousel-track"></div>
  </section>

  <!-- PAINEL PRINCIPAL -->
  <main class="main-layout">
    <div id="sectors-container" class="sectors-grid"></div>
  </main>

  <!-- MENU LATERAL -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Navegação</h2>
      <button id="btn-close-sidebar" class="close-btn">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="feed"><span class="nav-icon">📰</span> Central de Notícias</button>
      <button class="nav-item" data-view="saved"><span class="nav-icon">🔖</span> Salvos para Leitura</button>
      <button class="nav-item" data-view="stats"><span class="nav-icon">📊</span> Painel de Hábitos</button>
      <button class="nav-item" data-view="settings"><span class="nav-icon">⚙️</span> Configurações e Fontes</button>
    </nav>

    <!-- SEÇÃO DE CATEGORIAS DENTRO DO MENU (Ideal para Mobile) -->
    <div class="sidebar-section" style="padding: 0 15px; margin-top: 15px;">
      <h3 style="font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Editorias</h3>
      <div id="sidebar-categories-container" style="display: flex; flex-direction: column; gap: 4px;">
        <!-- Injetado dinamicamente via script.js -->
      </div>
    </div>

    <!-- RÓTULO DE VERSÃO DO APP -->
    <div class="sidebar-footer" style="padding: 15px; border-top: 1px solid var(--card-border); margin-top: auto; font-size: 0.75rem; color: var(--text-secondary); text-align: center;">
      Meu Feed • v1.4.1
    </div>
  </aside>

  <!-- BOTÃO FLUTUANTE ERGONÔMICO (Mão direita) -->
  <button id="btn-open-menu" class="floating-menu-btn" title="Abrir menu">☰</button>

  <!-- MODAL DE CONFIGURAÇÕES -->
  <div id="settings-modal" class="overlay-screen">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Ajustar Editorias e Fontes</h2>
        <button id="btn-close-settings" class="close-btn">&times;</button>
      </div>

      <div class="custom-keywords-box">
        <label for="settings-keywords"><strong>Termos de Destaque / Favoritos:</strong></label>
        <input type="text" id="settings-keywords">
      </div>

      <div class="custom-keywords-box" style="border-color: var(--accent-primary);">
        <label><strong>➕ Adicionar Novo Feed RSS Personalizado:</strong></label>
        <p style="font-size: 0.78rem; color: var(--text-secondary); margin-top: 4px;">Cole o link de qualquer blog ou portal:</p>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <input type="text" id="custom-rss-name" placeholder="Nome (Ex: Cinema Noir)" style="flex: 1; margin:0;">
          <input type="text" id="custom-rss-url" placeholder="URL do RSS (https://...)" style="flex: 2; margin:0;">
        </div>
        <button id="btn-add-custom-rss" class="primary-btn" style="margin-top: 10px; padding: 8px; font-size: 0.85rem;">Adicionar esta Fonte</button>
      </div>

      <div class="reorder-container">
        <label><strong>Ordem das Editorias e Fontes:</strong></label>
        <div class="reorder-list" id="settings-reorder-list"></div>
      </div>

      <button id="btn-save-settings" class="primary-btn">Salvar Alterações</button>
    </div>
  </div>

  <!-- LEITURA LIMPA (READER VIEW) -->
  <div id="reader-modal" class="overlay-screen">
    <div class="reader-content">
      <button id="btn-close-reader" class="close-btn">&times;</button>
      <div id="reader-body"></div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
